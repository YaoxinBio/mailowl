<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#23306B"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D98A00"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#FFFFFF"/>

  <!-- SMTP return path -->
  <path d="M1170 436 L1188 436 L1188 40 L135 40 L135 218" fill="none" stroke="#D98A00" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrA)"/>
  <rect x="380" y="24" width="440" height="32" rx="16" fill="#FFF4E0"/>
  <text x="600" y="46" text-anchor="middle" font-size="17" fill="#8A5600" font-weight="600">SMTP send — only after you tap Confirm, at most once</text>

  <!-- mailboxes -->
  <rect x="30" y="220" width="210" height="130" rx="18" fill="#FFF4E0" stroke="#23306B" stroke-width="2"/>
  <text x="135" y="262" text-anchor="middle" font-size="21" font-weight="700" fill="#1A2150">Your mailboxes</text>
  <text x="135" y="292" text-anchor="middle" font-size="16" fill="#3B4370">any IMAP / POP3</text>
  <text x="135" y="317" text-anchor="middle" font-size="16" fill="#3B4370">read-only fetch</text>
  <path d="M240 285 L318 285" stroke="#23306B" stroke-width="3" marker-end="url(#arr)"/>

  <!-- MailOwl container -->
  <rect x="320" y="90" width="560" height="510" rx="24" fill="#F1F2FA" stroke="#23306B" stroke-width="2.5"/>
  <text x="600" y="128" text-anchor="middle" font-size="22" font-weight="700" fill="#1A2150">MailOwl · runs on your own Mac</text>

  <rect x="345" y="150" width="235" height="86" rx="14" fill="#FFFFFF" stroke="#9AA3D6" stroke-width="1.5"/>
  <text x="462" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#1A2150">Local store</text>
  <text x="462" y="212" text-anchor="middle" font-size="15" fill="#3B4370">SQLite · mail stays here</text>

  <rect x="620" y="150" width="235" height="86" rx="14" fill="#FFFFFF" stroke="#9AA3D6" stroke-width="1.5"/>
  <text x="737" y="185" text-anchor="middle" font-size="18" font-weight="700" fill="#1A2150">Triage (LLM)</text>
  <text x="737" y="212" text-anchor="middle" font-size="15" fill="#3B4370">level · summary · deadline</text>
  <path d="M580 193 L618 193" stroke="#23306B" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="345" y="262" width="510" height="64" rx="14" fill="#FFFFFF" stroke="#9AA3D6" stroke-width="1.5"/>
  <text x="600" y="291" text-anchor="middle" font-size="18" font-weight="700" fill="#1A2150">Notify by level</text>
  <text x="600" y="314" text-anchor="middle" font-size="15" fill="#3B4370">daily digest · instant card · urgent alert with escalation</text>
  <path d="M737 236 L737 260" stroke="#23306B" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="345" y="352" width="510" height="100" rx="14" fill="#FFFFFF" stroke="#23306B" stroke-width="2"/>
  <text x="600" y="385" text-anchor="middle" font-size="18" font-weight="700" fill="#1A2150">Mail agent</text>
  <text x="600" y="410" text-anchor="middle" font-size="15" fill="#3B4370">searches past threads · drafts and revises replies</text>
  <text x="600" y="434" text-anchor="middle" font-size="15" font-weight="600" fill="#B42318">no send tool · no web access</text>

  <rect x="345" y="490" width="510" height="88" rx="14" fill="#FFFFFF" stroke="#D98A00" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="600" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#1A2150">Research agent</text>
  <text x="600" y="551" text-anchor="middle" font-size="15" fill="#3B4370">web only · cannot read mail · runs after you approve</text>
  <path d="M600 452 L600 488" stroke="#D98A00" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrA)"/>

  <!-- outputs -->
  <rect x="930" y="150" width="240" height="96" rx="18" fill="#FFF4E0" stroke="#23306B" stroke-width="2"/>
  <text x="1050" y="189" text-anchor="middle" font-size="21" font-weight="700" fill="#1A2150">Bark → iPhone</text>
  <text x="1050" y="219" text-anchor="middle" font-size="16" fill="#3B4370">urgent mail rings</text>

  <rect x="930" y="276" width="240" height="196" rx="18" fill="#FFF4E0" stroke="#23306B" stroke-width="2"/>
  <text x="1050" y="316" text-anchor="middle" font-size="21" font-weight="700" fill="#1A2150">Feishu / Lark bot</text>
  <text x="1050" y="351" text-anchor="middle" font-size="16" fill="#3B4370">mail cards</text>
  <text x="1050" y="378" text-anchor="middle" font-size="16" fill="#3B4370">chat about a thread</text>
  <text x="1050" y="405" text-anchor="middle" font-size="16" fill="#3B4370">revise · switch signature</text>
  <text x="1050" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#8A5600">Confirm send</text>

  <path d="M855 276 L928 214" stroke="#23306B" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M855 304 L928 318" stroke="#23306B" stroke-width="2.5" marker-end="url(#arr)"/>
  <path d="M857 402 L928 402" stroke="#23306B" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
</svg>
