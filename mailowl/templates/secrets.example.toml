# 复制到 ~/.config/mailowl/secrets.toml 并 chmod 600。不要提交到 git。

[feishu]
app_id = "cli_xxxxxxxxxxxxxxxx"
app_secret = ""

[llm]
api_key = ""                            # [llm] backend = "openai" 时的接口密钥
tavily_api_key = ""                     # 可选：openai 研究后端的网页搜索（tavily.com，每月免费 1000 次）

[bark]
device_keys = []                        # Bark App 首页 URL 里 api.day.app/ 后面那段

[accounts.work]                         # 与 config.toml 中 [[accounts]] 的 name 对应
password = ""                           # 邮箱「授权码 / 应用专用密码」，不是登录密码
# smtp_password = ""                    # 与 password 不同时才需要
