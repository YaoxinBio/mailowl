[project]
name = "mailowl"
version = "0.1.0"
description = "A self-hosted AI email secretary that never sends without you: multi-mailbox triage, drafts in Feishu/Lark, confirm-to-send, Bark alerts"
readme = "README.md"
license = "MIT"
authors = [{name = "Yaoxin Zhang"}]
requires-python = ">=3.11"
dependencies = [
    "lark-channel-sdk>=1.4,<2",
    "httpx>=0.24,<1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mailowl = "mailowl.cli:main"

[project.urls]
Homepage = "https://github.com/YaoxinBio/mailowl"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mailowl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
